function validatePack(pack){
if(!pack || !Array.isArray(pack.tasks) || !Array.isArray(pack.roles)) throw Error("Invalid pack.");
const ids=new Set(pack.tasks.map(t=>t.id)), roleIds=new Set(pack.roles.map(r=>r.id));
if(ids.size!==pack.tasks.length || roleIds.size!==pack.roles.length) throw Error("Duplicate task or role ID.");
const visited=new Set(), visiting=new Set();
function visit(id){
if(visiting.has(id)) throw Error("Dependency cycle.");
if(visited.has(id)) return;
const t=pack.tasks.find(t=>t.id===id);
if(!t) throw Error("Missing predecessor: "+id);
visiting.add(id);
for(const role of Object.keys(t.labor)) if(!roleIds.has(role)) throw Error("Unknown role: "+role);
for(const d of t.after) visit(d.task);
visiting.delete(id);visited.add(id);
}
pack.tasks.forEach(t=>visit(t.id));
return pack;
}

const price=m.priceoptionMult*(1+(m.key?s.keyShock:s.otherShock)/100);
const qty=m.qtyPerquantity,total=qtyprice;
materials+=total;
takeoff.push({task:task.name,item:m.item,unit:m.unit,qty,price,total,ti,mi});
});
for(const e of task.equipment) equipment+=e.hoursPerquantitye.ratePerHr;
return {...task,hours,start:0,duration:Math.max(task.minDays,...Object.entries(hours).map(([id,h])=>h/(effective(id)s.hours)))};
});
const done=new Set();
function schedule(id){
if(done.has(id)) return;
const t=tasks.find(t=>t.id===id);
t.after.forEach(d=>schedule(d.task));
t.start=Math.max(0,...t.after.map(d=>{
const p=tasks.find(t=>t.id===d.task);
return p.start+d.fracp.duration;
}));
done.add(id);
}
tasks.forEach(t=>schedule(t.id));
let days=Math.max(...tasks.map(t=>t.start+t.duration));
const limiting=pack.roles.map(r=>({id:r.id,days:totals[r.id]/(effective(r.id)s.hours)})).sort((a,b)=>b.days-a.days)[0];
const stretched=limiting.days>days;
if(stretched){
const factor=limiting.days/days;
tasks.forEach(t=>{t.start=factor;t.duration*=factor;});
days=limiting.days;
}
const weeks=Math.max(1,Math.ceil(days/pack.daysPerWeek));
const weekly=Array.from({length:weeks},(_,week)=>{
const a=weekpack.daysPerWeek,b=Math.min(days,a+pack.daysPerWeek);
const points=[a,...tasks.flatMap(t=>[t.start,t.start+t.duration]).filter(x=>x>=a&&x<b)];
const demand=Object.fromEntries(pack.roles.map(r=>{
const count=Math.max(0,...points.map(day=>tasks.reduce((n,t)=>{
return n+(t.start<=day+1e-8&&t.start+t.duration>day+1e-8&&t.duration>0?(t.hours[r.id]||0)/(t.durations.hours):0);
},0)));
return [r.id,Math.min(effective(r.id),count)];
}));
return {roles:demand,total:Object.values(demand).reduce((a,b)=>a+b,0)};
});
const general=pack.weeklyOverheadweeks,permits=pack.permitsPct(materials+labor);
const base=materials+labor+equipment+general+permits,contingency=bases.contingency;
const subtotal=base+contingency,overhead=subtotal.1,profit=(subtotal+overhead)*.08;
const total=subtotal+overhead+profit;
return {
tasks,takeoff,totals,warnings,days,weeks,weekly,total,stretched,bottleneck:limiting.id,
peak:Math.max(...weekly.map(w=>w.total)),average:weekly.reduce((n,w)=>n+w.total,0)/weeks,
hours:Object.values(totals).reduce((a,b)=>a+b,0),perUnit:total/s.driver,
costs:{"Materials":materials,"Labor":labor,"Equipment":equipment,"General conditions":general,"Permits / fees":permits,"Contingency":contingency,"Overhead":overhead,"Profit":profit}
};
}

function solve(pack,s,target){
let counts=Object.fromEntries(pack.roles.map(r=>[r.id,1]));
let result=calculate(pack,{...s,counts});
for(let i=0;i<400&&result.weeks>target;i++){
const candidates=pack.roles.filter(r=>counts[r.id]<40)
.sort((a,b)=>result.totals[b.id]/counts[b.id]-result.totals[a.id]/counts[a.id]);
if(!candidates.length) break;
counts={...counts,[candidates[0].id]:counts[candidates[0].id]+1};
result=calculate(pack,{...s,counts});
}
if(result.weeks>target){
counts=Object.fromEntries(pack.roles.map(r=>[r.id,40]));
result=calculate(pack,{...s,counts});
}
return {counts,result};
}

function recommendCrew(pack,s,target){
const solved=solve(pack,{...s,counts:defaults(pack).counts},target);
const counts=Object.fromEntries(pack.roles.map(r=>[r.id,solved.result.totals[r.id]>0?solved.counts[r.id]:0]));
const achievable=Math.max(target,solved.result.weeks);
for(const role of pack.roles){
while(counts[role.id]>1){
const trial={...counts,[role.id]:counts[role.id]-1};
if(calculate(pack,{...s,counts:trial}).weeks>achievable) break;
counts[role.id]--;
}
}
const forecast=calculate(pack,{...s,counts});
const suggestedRoles=pack.roles.map(role=>{
const tasks=forecast.tasks.filter(t=>(t.hours[role.id]||0)>0)
.sort((a,b)=>(b.hours[role.id]||0)-(a.hours[role.id]||0));
return {
id:role.id,count:counts[role.id],
reason:tasks.length?For ${tasks.slice(0,2).map(t=>t.name.toLowerCase()).join(" and ")}.:"No work assigned to this role."
};
});
return {counts,forecast,roles:suggestedRoles,total:Object.values(counts).reduce((a,b)=>a+b,0),feasible:forecast.weeks<=target};
}

function parseLocalText(text,revision=false){
const pack=state.pack;
const patterns={
construction:/([\d,]+(?:.\d+)?)\s*(?:sf\b|sq.?\sft\b|square\sfeet\b)/i,
agriculture:/([\d,]+(?:.\d+)?)\sacres?\b/i,
engineering:/(\d+)\ssubsystems?\b/i,
medical:/(\d+)\s*(?:exam\s*)?rooms?\b/i
};
const match=text.match(patterns[pack.id]);
let value=match?Number(match[1].replace(/,/g,"")):(revision?pack.revisionDriver:pack.driver.default);
const original=value;
value=clamp(value,pack.driver.min,pack.driver.max);
if(["engineering","medical"].includes(pack.id)) value=Math.round(value);
const options=Object.fromEntries(pack.options.map(o=>[o.id,0]));
const notes=["Read locally using explicit numbers and option labels; no AI model is connected."];
if(!match) notes.push(No explicit ${pack.driver.label.toLowerCase()} found. A sample value was used.);
if(value!==original) notes.push("The driver was constrained to the supported pack range.");
for(const option of pack.options){
if(option.id==="stories"){
const story=text.match(/([123])\s*(?:stories|story)\b/i);
options.stories=story?Number(story[1])-1:0;
if(!story) notes.push("Stories not specified; assumed one story.");
}else{
const found=option.choices.findIndex(c=>text.toLowerCase().includes(c.label.toLowerCase()));
options[option.id]=found>=0?found:0;
if(found<0) notes.push(${option.label} not found; using ${option.choices[0].label}.);
}
}
return {driver:value,options,notes,source:match?"Local text":"Sample fallback"};
}

async function readScope(revision=false){
state.busy=true;state.notice="";render();
try{
const file=revision?state.revisionFile:state.file;
let text=revision?"":state.text;
if(file){
const extension=file.name.split(".").pop().toLowerCase();
if(file.size>810241024) throw Error("The file is larger than 8 MB.");
if(["txt","csv"].includes(extension)) text+="\n"+(await file.text()).slice(0,100000);
else {
loadSample(revision);
state.source=revision?state.source:"Sample fallback";
if(!revision) state.notes.push("The uploaded image, PDF, or spreadsheet was not analyzed.");
state.notice="This standalone HTML file has no secure AI server. Image, PDF, and XLSX analysis is unavailable, so labeled sample values were loaded. You can correct every project detail.";
return;
}
}
if(!text.trim()) throw Error("Upload a text/CSV file, describe the project, or use a sample.");
const extracted=parseLocalText(text,revision);
if(revision) state.revision=extracted;
else{
state.s.driver=extracted.driver;state.s.options=extracted.options;
state.notes=extracted.notes;state.source=extracted.source;state.scopeReady=true;state.revision=null;
}
state.notice="Local text reading complete. Review the values and assumptions before continuing.";
}catch(error){
loadSample(revision);
state.notice=${error.message} Loaded labeled sample values to keep the demo working.;
}finally{
state.busy=false;render();
}
}

if(state.step===4) content=resultsHTML(out);
body=<nav class="steps" aria-label="Planning steps">${stepNames.map((name,i)=>
<button data-action="step" data-step="${i+1}" ${i+1>state.furthest||state.busy?"disabled":""} ${state.step===i+1?'aria-current="step"':""}><span class="step-number">${i+1<state.step?icon("check"):i+1}</span><span>${name}</span></button>).join("")}</nav> <main class="page"><div class="page-intro"><p class="eyebrow">${esc(state.pack.name)} · Step ${state.step} of 4</p><h1 id="page-title" tabindex="-1">${headings[state.step]}</h1><p>${subtitles[state.step]}</p></div>${noticeHTML()}${content}</main>${footerHTML()};
}
const app=$("#app");app.className="app"+(state.dark?" dark":"");app.innerHTML=headerHTML()+body;
for(const id of openDetails) document.querySelector(details[data-detail="${CSS.escape(id)}"])?.setAttribute("open","");
[...document.querySelectorAll(".table-scroll")].forEach((el,i)=>{
if(scrollers[i]){el.scrollTop=scrollers[i].top;el.scrollLeft=scrollers[i].left;}
});
if(focusKey){
const next=document.querySelector([data-key="${CSS.escape(focusKey)}"]);
if(next){
if(rawValue!==null&&next.tagName!=="SELECT") next.value=rawValue;
next.focus({preventScroll:true});
try{if(selection&&selection[0]!==null)next.setSelectionRange(...selection);}catch{}
}
}
}

function normalizeInput(input){
const value=Number(input.value);
const min=input.min===""?0:Number(input.min),max=input.max===""?1000000:Number(input.max);
return clamp(Number.isFinite(value)?value:min,min,max);
}
function updateField(input,final=false){
const key=input.dataset.key;
if(!key) return;
if(key==="scope-text"){
state.text=input.value;state.scopeReady=false;
const next=document.querySelector('[data-action="next"]'),read=document.querySelector('[data-action="read"]');
if(next) next.disabled=!state.file&&!state.text.trim();
if(read) read.disabled=!state.file&&!state.text.trim();
document.querySelector(".ready")?.remove();
return;
}
if(key.startsWith("pilot:")){state.pilot[key.slice(6)]=input.value;return;}
if(key==="model-turn"){state.model.turn=Number(input.value);updateModelTransform();return;}
if(key==="model-zoom"){state.model.zoom=Number(input.value);updateModelTransform();return;}
if(input.type==="file") return;
const value=normalizeInput(input),parts=key.split(":");
if(key==="driver"||key==="driver-range") state.s.driver=value;
else if(key==="hours") state.s.hours=value;
else if(key==="target") state.target=Math.round(value);
else if(key==="contingency") state.s.contingency=Number(input.value);
else if(key==="keyShock") state.s.keyShock=value;
else if(key==="otherShock") state.s.otherShock=value;
else if(key==="weeklyOverhead") state.pack.weeklyOverhead=value;
else if(key==="permits") state.pack.permitsPct=value/100;
else if(key==="task-index") state.taskIndex=Number(input.value);
else if(key==="timeline-week") state.week=value-1;
else if(key==="revision-driver"&&state.revision) state.revision.driver=value;
else if(key==="model-inside") state.model.inside=input.checked;
else if(parts[0]==="option") state.s.options[parts[1]]=Number(input.value);
else if(parts[0]==="revision-option"&&state.revision) state.revision.options[parts[1]]=Number(input.value);
else if(parts[0]==="count") state.s.counts[parts[1]]=Math.round(value);
else if(parts[0]==="rate") state.s.rates[parts[1]]=value;
else if(parts[0]==="task") state.pack.tasks[+parts[1]][parts[2]]=value;
else if(parts[0]==="labor") state.pack.tasks[+parts[1]].labor[parts[2]]=value;
else if(parts[0]==="material") state.pack.tasks[+parts[1]].materials[+parts[2]][parts[3]]=value;
else if(parts[0]==="equipment") state.pack.tasks[+parts[1]].equipment[+parts[2]][parts[3]]=value;
else if(parts[0]==="choice") state.pack.options[+parts[1]].choices[+parts[2]][parts[3]]=value;
else if(parts[0]==="mult") state.pack.options[+parts[1]].choices[+parts[2]].taskMults[parts[3]]=value;
else if(parts[0]==="roi") state.roi[parts[1]]=value;
render(!final);
}

document.addEventListener("input",event=>{
const input=event.target;
if(!input.matches("[data-key]")||input.type==="file"||input.type==="checkbox"||input.tagName==="SELECT") return;
updateField(input);
});
document.addEventListener("change",event=>{
const input=event.target,key=input.dataset.key;
if(!key) return;
if(key==="scope-file"){
state.file=input.files[0]||null;state.scopeReady=false;
if(state.filePreview) URL.revokeObjectURL(state.filePreview);
state.filePreview=state.file?.type.startsWith("image/")?URL.createObjectURL(state.file):"";
render();return;
}
if(key==="revision-file"){state.revisionFile=input.files[0]||null;render();return;}
if(key==="scope-text"||key.startsWith("pilot:")) return;
updateField(input,true);
});

document.addEventListener("click",async event=>{
const button=event.target.closest("button[data-action]");
if(!button||button.disabled) return;
const name=button.dataset.action;
if(name==="home"){navigate(0);return;}
if(name==="industry"){chooseIndustry(Number(button.dataset.index));return;}
if(name==="theme"){state.dark=!state.dark;render();return;}
if(name==="about"){
if(state.step===5) navigate(state.returnStep);
else{state.returnStep=state.step;navigate(5);}
return;
}
if(name==="about-tab"){state.aboutTab=button.dataset.view;render();focusHeading();return;}
if(name==="back"){navigate(state.step===1?0:state.step-1);return;}
if(name==="step"){navigate(Number(button.dataset.step));return;}
if(name==="next"){
if(state.step===1&&!state.scopeReady) await readScope(false);
navigate(Math.min(4,state.step+1));return;
}
if(name==="edit-project"){navigate(1);return;}
if(name==="edit-crew"){navigate(3);return;}
if(name==="sample"){loadSample(false);render();return;}
if(name==="sample-text"){state.text=state.pack.sample;state.scopeReady=false;state.notice="Sample scope inserted. Read it locally, then review the details.";render();return;}
if(name==="read"){await readScope(false);return;}
if(name==="read-revision"){await readScope(true);return;}
if(name==="sample-revision"){loadSample(true);render();return;}
if(name==="download-sample"){
const url=URL.createObjectURL(new Blob([state.pack.sample+"\n\n"+state.pack.notes],{type:"text/plain"}));
const link=document.createElement("a");link.href=url;link.download=exind-${state.pack.id}-sample.txt;link.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);return;
}
if(name==="apply-crew"){
state.s.counts={...recommendCrew(state.pack,state.s,state.target).counts};
state.notice="Recommended crew applied. You can adjust any role below.";render();return;
}
if(name==="count"){
const id=button.dataset.role;
state.s.counts[id]=clamp(state.s.counts[id]+Number(button.dataset.delta),0,40);
render();return;
}
if(name==="view"){state.view=button.dataset.view;render();focusHeading();return;}
if(name==="rate-view"){state.rateView=button.dataset.view;render();return;}
if(name==="week"){
const out=calculate(state.pack,state.s);
state.week=clamp(Number(button.dataset.week),0,out.weeks-1);render();return;
}
if(name==="select-task"||name==="inspect-task"){
state.selectedTask=button.dataset.task;
if(name==="select-task"){
const out=calculate(state.pack,state.s),t=out.tasks.find(t=>t.id===state.selectedTask);
state.week=Math.min(out.weeks-1,Math.floor(t.start/state.pack.daysPerWeek));
}
render();return;
}
if(name==="model-reset"){
state.model={turn:-28,tilt:58,zoom:1,inside:state.model.inside};render();return;
}
});

let modelDrag=null;
document.addEventListener("pointerdown",event=>{
const stage=event.target.closest(".model-stage");
if(!stage||event.button!==0) return;
stage.setPointerCapture(event.pointerId);
modelDrag={stage,x:event.clientX,y:event.clientY,turn:state.model.turn,tilt:state.model.tilt};
});
document.addEventListener("pointermove",event=>{
if(!modelDrag) return;
state.model.turn=modelDrag.turn+(event.clientX-modelDrag.x).6;
state.model.tilt=clamp(modelDrag.tilt-(event.clientY-modelDrag.y).3,25,75);
updateModelTransform();
const control=document.querySelector('[data-key="model-turn"]');
if(control) control.value=((state.model.turn+180)%360+360)%360-180;
});
function endDrag(){modelDrag=null;}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);

function runChecks(){
for(const pack of PACKS){
const s=defaults(pack),out=calculate(pack,s);
console.assert(out.total>0,pack.name+": bid must be positive");
console.assert(calculate(pack,{...s,keyShock:20}).total>out.total,pack.name+": key-material shock must raise cost");
const largerCrew=calculate(pack,{...s,counts:Object.fromEntries(pack.roles.map(r=>[r.id,40]))});
console.assert(largerCrew.days<out.days,pack.name+": larger crew should shorten the sample");
console.assert(largerCrew.tasks.every(t=>t.duration>=t.minDays),pack.name+": duration floors must be preserved");
console.assert(Math.abs(Object.values(out.costs).reduce((a,b)=>a+b,0)-out.total)<.001,pack.name+": costs must balance");
}
const invalid=clone(PACKS[0]);invalid.tasks[0].after=[{task:"missing",frac:1}];
let rejected=false;try{validatePack(invalid);}catch{rejected=true;}
console.assert(rejected,"Validator must reject a missing predecessor");
const p=PACKS[2],s=defaults(p),a=recommendCrew(p,s,16),b=recommendCrew(p,{...s,driver:24,options:{complexity:2}},16);
console.assert(b.total>a.total,"Larger engineering scopes should recommend larger crews");
console.assert(JSON.stringify(recommendCrew(p,{...s,counts:Object.fromEntries(p.roles.map(r=>[r.id,39]))},16).counts)===JSON.stringify(a.counts),"Manual crew changes must not overwrite recommendations");
}

runChecks();
render();
</script>
